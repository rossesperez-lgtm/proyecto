services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: auth_api
      POSTGRES_USER: auth_api
      POSTGRES_PASSWORD: auth_api
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_api -d auth_api"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
